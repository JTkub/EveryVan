<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1580" viewBox="0 0 2000 1580" role="img" aria-label="เว็บของเราเชื่อมกันอย่างไร">
<style>text{font-family:Tahoma,"Leelawadee UI",sans-serif}</style>
<defs>
