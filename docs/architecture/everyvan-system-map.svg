<path d="M1380 1070 L1230 1070" fill="none" stroke="#087f74" stroke-width="4" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1305" y="1044" font-size="23" fill="#087f74" font-weight="400" text-anchor="middle">SQL</text>
<path d="M550 1070 L700 1070" fill="none" stroke="#087f74" stroke-width="4" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="625" y="1044" font-size="23" fill="#087f74" font-weight="400" text-anchor="middle">SQL</text>
<path d="M80 1370 L1920 1370" fill="none" stroke="#d6e0ec" stroke-width="2"/>
<text x="80" y="1423" font-size="27" fill="#172b46" font-weight="400" text-anchor="start">ไฟล์ช่วย: types/domain.ts = รูปแบบข้อมูล  •  utils/date.ts / vehicle.ts = วันที่และความจุรถ</text>
<text x="80" y="1470" font-size="27" fill="#52657c" font-weight="400" text-anchor="start">App.css + index.css = หน้าตาเว็บ  •  public/ = รูปภาพและ favicon</text>
<text x="80" y="1535" font-size="27" fill="#ad651a" font-weight="400" text-anchor="start">ชำระเงินยังเป็น Demo  •  การจอง ตั๋ว และ QR เช็กอินบันทึกจริงใน PostgreSQL</text>
