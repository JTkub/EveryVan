<rect width="2000" height="1580" fill="#f5f8fc"/>
<text x="80" y="82" font-size="25" fill="#2765d7" font-weight="700" text-anchor="start">EVERYVAN / CODE MAP</text>
<text x="80" y="153" font-size="54" fill="#172b46" font-weight="700" text-anchor="start">เว็บของเราเชื่อมกันอย่างไร</text>
<text x="80" y="205" font-size="26" fill="#52657c" font-weight="400" text-anchor="start">อ่านตามลูกศร = เรียกใช้ / ส่งคำขอ  •  ข้อมูลตอบกลับย้อนเส้นเดิม  •  อิงโค้ด 15 ต.ค. 2026</text>
<text x="80" y="277" font-size="28" fill="#2765d7" font-weight="700" text-anchor="start">01  หน้าจอที่ผู้ใช้เห็น</text>
<text x="700" y="277" font-size="28" fill="#2765d7" font-weight="700" text-anchor="start">02  ตัวกลางข้อมูลใน React</text>
<text x="1380" y="277" font-size="28" fill="#2765d7" font-weight="700" text-anchor="start">03  ตัวส่งคำขอไปเซิร์ฟเวอร์</text>
<rect x="80" y="310" width="470" height="380" rx="20" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/>
<text x="112" y="365" font-size="29" fill="#172b46" font-weight="700" text-anchor="start">src/main.tsx → App.tsx</text>
<text x="112" y="416" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">VanProvider ครอบ Dashboard</text>
<text x="112" y="470" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">ยังไม่ล็อกอิน → AuthView</text>
<text x="112" y="515" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">ล็อกอินแล้ว → DashboardContent</text>
<path d="M112 541 L518 541" fill="none" stroke="#d6e0ec" stroke-width="2"/>
<text x="112" y="584" font-size="26" fill="#2765d7" font-weight="400" text-anchor="start">เลือกหน้าจอด้วย active + role</text>
<text x="112" y="626" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">จองตั๋ว / จัดคิว / คนขับ / บัญชี</text>
<text x="112" y="666" font-size="25" fill="#52657c" font-weight="400" text-anchor="start">หน้าส่วนใหญ่อยู่ใน App.tsx</text>
<rect x="700" y="310" width="530" height="380" rx="20" fill="#edf4ff" stroke="#c8dafa" stroke-width="2"/>
<text x="732" y="365" font-size="29" fill="#172b46" font-weight="700" text-anchor="start">src/context/VanContext.tsx</text>
<text x="732" y="417" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">useVan() ให้หน้าเว็บใช้ข้อมูลร่วมกัน</text>
<text x="732" y="469" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">ผู้ใช้ • เที่ยวรถ • คนขับ • การจอง</text>
<text x="732" y="512" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">ธุรกรรม • แจ้งเตือน</text>
<path d="M732 541 L1198 541" fill="none" stroke="#c8dafa" stroke-width="2"/>
<text x="732" y="584" font-size="25" fill="#2765d7" font-weight="400" text-anchor="start">bookTicket / confirmPayment / ...</text>
<text x="732" y="627" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">refreshDatabase() โหลดข้อมูลใหม่</text>
<text x="732" y="667" font-size="25" fill="#52657c" font-weight="400" text-anchor="start">ล็อกอินแล้วดึงข้อมูลทุก 5 วินาที</text>
<rect x="1380" y="310" width="540" height="380" rx="20" fill="#edf4ff" stroke="#c8dafa" stroke-width="2"/>
<text x="1412" y="365" font-size="31" fill="#172b46" font-weight="700" text-anchor="start">src/services/api.ts</text>
<text x="1412" y="417" font-size="27" fill="#172b46" font-weight="400" text-anchor="start">รวม request() และแปลงข้อมูล</text>
<text x="1412" y="469" font-size="27" fill="#2765d7" font-weight="400" text-anchor="start">fetch + JSON + Bearer token</text>
<text x="1412" y="514" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">ปลายทาง /api หรือ VITE_API_URL</text>
