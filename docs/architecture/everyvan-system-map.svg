<path d="M112 1210 L518 1210" fill="none" stroke="#c3e4db" stroke-width="2"/>
<text x="112" y="1255" font-size="26" fill="#087f74" font-weight="400" text-anchor="start">ใช้ฐานข้อมูลเดียวกับ API</text>
<text x="112" y="1295" font-size="25" fill="#52657c" font-weight="400" text-anchor="start">ทำงานได้แม้ไม่มีคนเปิดเว็บ</text>
<rect x="700" y="899" width="530" height="420" rx="20" fill="#f0faf7" stroke="#c3e4db" stroke-width="2"/>
<text x="732" y="957" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="732" y="1006" font-size="25" fill="#087f74" font-weight="400" text-anchor="start">โครงสร้าง: api/ticket_schema.sql</text>
<text x="732" y="1054" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">app_user / auth_session / บทบาท</text>
<text x="732" y="1097" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">route / vehicle / schedule / trip</text>
<text x="732" y="1140" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">booking / payment / ticket</text>
<text x="732" y="1183" font-size="24" fill="#172b46" font-weight="400" text-anchor="start">recurring_schedule / driver_review</text>
<text x="732" y="1226" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">notification / travel_follower</text>
<text x="732" y="1269" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">audit_log</text>
<rect x="1380" y="899" width="540" height="420" rx="20" fill="#f0faf7" stroke="#c3e4db" stroke-width="2"/>
<text x="1412" y="957" font-size="30" fill="#172b46" font-weight="700" text-anchor="start">api/app.py — Flask API</text>
<text x="1412" y="1006" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">รับ /api/* และตรวจสิทธิ์แต่ละบทบาท</text>
<text x="1412" y="1055" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">จอง / จ่าย / ออกตั๋ว / เช็กอิน / จัดคิว</text>
<text x="1412" y="1098" font-size="26" fill="#087f74" font-weight="400" text-anchor="start">อ่านและเขียน SQL ผ่าน psycopg</text>
<path d="M1412 1126 L1888 1126" fill="none" stroke="#c3e4db" stroke-width="2"/>
<text x="1412" y="1171" font-size="24" fill="#172b46" font-weight="400" text-anchor="start">security.py: รหัสผ่าน + session token</text>
<text x="1412" y="1214" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">recurring.py: สร้าง / ปรับคิวประจำ</text>
<text x="1412" y="1260" font-size="23" fill="#52657c" font-weight="400" text-anchor="start">ก่อนรับคำขอมี maintenance ช่วยอีกทาง</text>
<text x="1412" y="1297" font-size="24" fill="#52657c" font-weight="400" text-anchor="start">ตรรกะ backend หลักรวมอยู่ในไฟล์นี้</text>
<path d="M1800 690 L1800 899" fill="none" stroke="#087f74" stroke-width="4" stroke-linejoin="round" marker-end="url(#teal)"/>
