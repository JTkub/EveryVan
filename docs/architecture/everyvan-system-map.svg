<text x="1412" y="626" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">Docker: Nginx /api → api:5000</text>
<text x="1412" y="666" font-size="25" fill="#52657c" font-weight="400" text-anchor="start">เก็บ session ใน localStorage</text>
