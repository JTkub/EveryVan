<path d="M1230 428 L1380 428" fill="none" stroke="#2765d7" stroke-width="4" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1305" y="401" font-size="23" fill="#2765d7" font-weight="400" text-anchor="middle">api.*</text>
<path d="M550 609 L620 609 L620 770 L1650 770 L1650 690" fill="none" stroke="#7852bd" stroke-width="4" stroke-linejoin="round" stroke-dasharray="12 9" marker-end="url(#purple)"/>
<text x="710" y="750" font-size="25" fill="#7852bd" font-weight="400" text-anchor="start">เรียก api.ts ตรง: จัดการบัญชี / ผู้ติดตาม / สแกน QR / คิวประจำ</text>
<text x="80" y="862" font-size="28" fill="#087f74" font-weight="700" text-anchor="start">06  งานที่รันเบื้องหลัง</text>
<text x="700" y="862" font-size="28" fill="#087f74" font-weight="700" text-anchor="start">05  ฐานข้อมูลถาวร</text>
<text x="1380" y="862" font-size="28" fill="#087f74" font-weight="700" text-anchor="start">04  ตรวจสิทธิ์และทำงานจริง</text>
<rect x="80" y="899" width="470" height="420" rx="20" fill="#f0faf7" stroke="#c3e4db" stroke-width="2"/>
<text x="112" y="957" font-size="30" fill="#172b46" font-weight="700" text-anchor="start">api/maintenance.py</text>
<text x="112" y="1006" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">scheduler ทำงานทุก 30 วินาที</text>
<text x="112" y="1050" font-size="26" fill="#087f74" font-weight="400" text-anchor="start">เรียก api/recurring.py</text>
<text x="112" y="1100" font-size="26" fill="#172b46" font-weight="400" text-anchor="start">สร้างเที่ยวรถในช่วง 7 วัน</text>
<text x="112" y="1142" font-size="25" fill="#172b46" font-weight="400" text-anchor="start">ยกเลิกการจองที่หมดเวลา</text>
